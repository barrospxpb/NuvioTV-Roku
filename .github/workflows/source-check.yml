name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source structure and text files
        run: python tools/check_source.py
      - name: Package Roku sideload channel
        run: python tools/package_roku.py
